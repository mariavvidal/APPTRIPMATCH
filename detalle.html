  <!--
    Página de detalle ("Ver más" de cada tarjeta). No es un modal ni
    un popup: es una página propia como comparar.html, que lee el id
    del viaje desde la URL (detalle.html?id=9) y arma el contenido
    con main.js. Reutiliza las mismas clases de "dato-chip" y
    "tag-actividad" que ya usa la tarjeta rápida de buscar.html/
    comparar.html — misma lógica de estandarización, solo que acá
    hay más espacio para desarrollarla (galería + texto completo de
    "incluye" en vez del resumen corto de la tarjeta).
  -->
  <main class="pagina-interna">
    <div class="contenedor-ancho">
      <a href="buscar.html" class="volver-atras"><i class="fa-solid fa-arrow-left"></i> Volver a la búsqueda</a>

      <div id="detalle-viaje">
        <p class="mensaje-vacio">Cargando viaje...</p>
      </div>
    </div>
  </main>
